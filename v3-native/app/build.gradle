plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lestalk.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.lestalk.pro"
        minSdk 24
        targetSdk 34
        versionCode 300
        versionName "3.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'html', 'css', 'js'
    }
}

android.packagingOptions {
    jniLibs {
        useLegacyPackaging = true
    }
}
